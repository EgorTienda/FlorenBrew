name: Build and Release Rust Binary

on:
  workflow_dispatch:
    inputs:
      version:
        description: '1. Версия релиза (например, 0.2.0)'
        required: true
        default: '0.2.0'
      release_description:
        description: '2. Описание релиза (changelog)'
        required: true
        default: 'Релиз florenbrew на Rust'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Update version in Cargo.toml
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "[*] Установка версии $VERSION в Cargo.toml..."
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      - name: Build release binary
        run: |
          cargo build --release
          
          # Подготавливаем папку для артефактов
          mkdir -p dist
          BINARY_NAME="florenbrew"
          VERSION="${{ github.event.inputs.version }}"
          ARCHIVE_NAME="florenbrew-v${VERSION}-linux-amd64.tar.gz"
          
          # Копируем бинарник и упаковываем в архив
          cp target/release/$BINARY_NAME dist/
          cd dist
          tar -czvf "$ARCHIVE_NAME" "$BINARY_NAME"
          rm "$BINARY_NAME"
          
          # Сохраняем имя архива в переменные окружения GitHub Actions
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Generate Checksums (SHA256)
        run: |
          cd dist
          echo "[*] Генерация SHA256 хэш-сумм..."
          ARCHIVE="${{ env.ARCHIVE_NAME }}"
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          
          # Извлекаем хэш-сумм строку и сохраняем в GITHUB_ENV
          HASH=$(awk '{print $1}' "${ARCHIVE}.sha256")
          echo "SHA256_HASH=$HASH" >> $GITHUB_ENV
          ls -la

      - name: Prepare Release Notes
        run: |
          cat << EOF > release_notes.md
          ${{ github.event.inputs.release_description }}

          ---
          ### 🚀 Установка с помощью клиента florenbrew
          \`\`\`bash
          florenbrew install egortienda/florenbrew
          \`\`\`

          ### 🔒 Контрольная сумма (SHA256)
          \`\`\`text
          ${{ env.SHA256_HASH }}  ${{ env.ARCHIVE_NAME }}
          \`\`\`

          Для проверки подлинности архива:
          \`\`\`bash
          echo "${{ env.SHA256_HASH }}  ${{ env.ARCHIVE_NAME }}" | sha256sum -c -
          \`\`\`
          EOF

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ github.event.inputs.version }}"
          name: "Florenbrew v${{ github.event.inputs.version }}"
          body_path: "release_notes.md"
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
